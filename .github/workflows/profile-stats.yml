name: Update public profile statistics

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test test/stats.test.mjs

  writer:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch public metadata and generate SVG
        run: node scripts/stats.mjs
      - name: Commit refreshed artifact
        run: |
          if ! git diff --quiet -- assets/stats.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/stats.svg
            git commit -m 'docs: refresh public repository statistics'
            git push origin HEAD:main
          fi
